<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CifraBox - Início</title>
    <link rel="stylesheet" href="./home.css">
</head>
<body>
    <header>
        <a class="logo" href="/home">Cifra<span>Box</span></a>

        <div class="profile">
            <div class="username">

            </div>
        </div>
    </header>

    <nav>
        <a href="/home" class="ativo">Início</a>
        <a href="#musicas">Músicas</a>
        <a href="#pastas">Pastas</a>
    </nav>

    <main>
        <div class="acoes">
            <input type="search" id="busca" placeholder="Buscar música ou artista">
            <a class="botao" href="/nova-musica">Adicionar música</a>
        </div>

        <section id="musicas">
            <h2>Adicionadas recentemente</h2>
            <div id="listaMusicas"></div>
            <p class="vazio" id="semMusicas">Você ainda não tem músicas. Comece adicionando a sua primeira!</p>
        </section>

        <section id="pastas">
            <h2>Pastas</h2>
            <p class="vazio">Você ainda não criou nenhuma pasta.</p>
        </section>
    </main>

    <script>

        async function init() {
            const response = await fetch("/login/user")

            if(!response.ok){
                alert("usuario nao esta logado")
                window.location.href = "/"
                return
            }

            const data = await response.json()
            document.querySelector(".profile .username").textContent = data.username
        }
        init()
    </script>

    <script>
        const listaMusicas = document.querySelector('#listaMusicas')
        const semMusicas = document.querySelector('#semMusicas')
        const busca = document.querySelector('#busca')

        let musicas = []

        function mostrar() {
            const texto = busca.value.toLowerCase()

            const lista = texto
                ? musicas.filter((m) => m.nome.toLowerCase().includes(texto) || (m.artista || '').toLowerCase().includes(texto))
                : musicas.slice(0, 5)

            semMusicas.hidden = musicas.length > 0
            listaMusicas.replaceChildren()

            lista.forEach((musica) => {
                const item = document.createElement('a')
                item.className = 'musica'
                item.href = '/musica/' + musica.id

                const info = document.createElement('div')
                info.className = 'info'

                const nome = document.createElement('strong')
                nome.textContent = musica.nome

                const artista = document.createElement('span')
                artista.textContent = musica.artista

                info.append(nome, artista)
                item.append(info)

                if (musica.tom) {
                    const tom = document.createElement('small')
                    tom.className = 'tom'
                    tom.textContent = musica.tom
                    item.append(tom)
                }

                listaMusicas.append(item)
            })
        }

        async function carregarMusicas() {
            const response = await fetch('/music')
            if (!response.ok)
                return

            const data = await response.json()
            musicas = data.sort((a, b) => b.id - a.id)
            mostrar()
        }

        busca.addEventListener('input', mostrar)
        carregarMusicas()
    </script>
</body>
</html>
