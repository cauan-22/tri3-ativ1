<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CifraBox - Login</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <main>
        <h1>Cifra<span>Box</span></h1>

        <form id="frmLogin">
            <input type="email" name="username" placeholder="email de login" required>
            <input type="password" name="password" placeholder="senha" required>
            <button type="submit">entrar</button>
            <p>Não tem conta? <a href="#" id="linkCadastro">Criar conta</a></p>
        </form>

        <form id="frmCadastro" hidden>
            <input type="email" name="username" placeholder="email de login" required>
            <input type="password" name="password" placeholder="crie a senha" required>
            <button type="submit">cadastrar</button>
            <p>Já tem conta? <a href="#" id="linkLogin">Entrar</a></p>
        </form>
    </main>

    <script>
        const frmLogin = document.querySelector('#frmLogin')
        const frmCadastro = document.querySelector('#frmCadastro')

        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 404)
                return alert("Usuário não encontrado")

            if (response.status == 401)
                return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }

            alert("Não deveria chegar aqui")
        })

        frmCadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmCadastro.username.value,
                    "password": frmCadastro.password.value
                })
            })
            if (response.ok) {
                alert("Usuário cadastrado com sucesso!")
                frmCadastro.reset()
                return
            }

            const data = await response.json()
            alert(data.msg || "Erro ao cadastrar usuário")
        })
   
        const linkCadastro = document.querySelector('#linkCadastro')
        const linkLogin = document.querySelector('#linkLogin')

        linkCadastro.addEventListener('click', (ev) => {
            ev.preventDefault()
            frmLogin.hidden = true
            frmCadastro.hidden = false
        })

        linkLogin.addEventListener('click', (ev) => {
            ev.preventDefault()
            frmLogin.hidden = false
            frmCadastro.hidden = true
        })
    </script>
</body>

</html>
