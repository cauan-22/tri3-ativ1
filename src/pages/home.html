
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CifraBox - Início</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #141414;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header, nav, main {
            max-width: 900px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            padding-bottom: 12px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: #f5c518;
        }

        .username {
            font-size: 14px;
            color: #bbb;
        }

        nav {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #3a3a3a;
        }

        nav a {
            padding: 8px 0;
            margin-bottom: -1px;
            color: #bbb;
            text-decoration: none;
            border-bottom: 3px solid transparent;
        }

        nav a.ativo {
            color: #fff;
            border-bottom-color: #f5c518;
        }

        main {
            padding-top: 24px;
            padding-bottom: 48px;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .acoes {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        #busca {
            flex: 1;
            min-width: 0;
            padding: 12px;
            font-size: 16px;
            color: #fff;
            background: #1f1f1f;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
        }

        #busca:focus {
            outline: none;
            border-color: #f5c518;
        }

        .botao {
            padding: 12px 16px;
            font-weight: bold;
            white-space: nowrap;
            color: #141414;
            background: #f5c518;
            border-radius: 4px;
            text-decoration: none;
        }

        .botao:hover {
            background: #ffd633;
        }

        #listaMusicas {
            border-top: 1px solid #3a3a3a;
        }

        .musica {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            color: #fff;
            border-bottom: 1px solid #3a3a3a;
            text-decoration: none;
        }

        .musica:hover strong {
            color: #f5c518;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .info span {
            font-size: 14px;
            color: #bbb;
        }

        .tom {
            padding: 2px 8px;
            font-size: 14px;
            font-weight: bold;
            color: #141414;
            background: #f5c518;
            border-radius: 4px;
        }

        .vazio {
            margin: 0;
            font-size: 15px;
            color: #bbb;
        }

        @media (max-width: 600px) {
            .acoes {
                flex-direction: column;
            }

            .acoes .botao {
                text-align: center;
            }

            nav {
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="/home">Cifra<span>Box</span></a>

        <div class="profile">
            <div class="username"></div>
        </div>
    </header>

    <nav>
        <a href="/home" class="ativo">Início</a>
        <a href="/musicas">Músicas</a>
        <a href="/pastas">Pastas</a>
    </nav>

    <main>
        <div class="acoes">
            <input type="search" id="busca" placeholder="Buscar música ou artista">
            <a class="botao" href="/nova-musica">Adicionar música</a>
        </div>

        <section id="musicas">
            <h2>Adicionadas recentemente</h2>
            <div id="listaMusicas"></div>
            <p class="vazio" id="semMusicas">
                Você ainda não tem músicas. Comece adicionando a sua primeira!
            </p>
        </section>

        <section id="pastas">
            <h2>Pastas</h2>
            <p class="vazio">Você ainda não criou nenhuma pasta.</p>
        </section>
    </main>

    <script>
        async function init() {
            const response = await fetch("/login/user");

            if (!response.ok) {
                window.location.href = "/";
                return;
            }

            const data = await response.json();
            document.querySelector(".profile .username").textContent = data.username;
        }

        init();

        const listaMusicas = document.querySelector('#listaMusicas');
        const semMusicas = document.querySelector('#semMusicas');
        const busca = document.querySelector('#busca');

        let musicas = [];

        function mostrar() {
            const texto = busca.value.toLowerCase();

            const lista = texto
                ? musicas.filter(m =>
                    m.nome.toLowerCase().includes(texto) ||
                    (m.artista || '').toLowerCase().includes(texto)
                )
                : musicas.slice(0, 5);

            semMusicas.hidden = musicas.length > 0;
            listaMusicas.replaceChildren();

            if (texto && lista.length === 0) {
                semMusicas.hidden = false;
                semMusicas.textContent = 'Nenhuma música encontrada.';
            } else if (musicas.length === 0) {
                semMusicas.textContent = 'Você ainda não tem músicas. Comece adicionando a sua primeira!';
            }

            lista.forEach(musica => {
                const item = document.createElement('a');
                item.className = 'musica';
                item.href = '/musica/' + musica.id;

                const info = document.createElement('div');
                info.className = 'info';

                const nome = document.createElement('strong');
                nome.textContent = musica.nome;

                const artista = document.createElement('span');
                artista.textContent = musica.artista || '';

                info.append(nome, artista);
                item.append(info);

                if (musica.tom) {
                    const tom = document.createElement('small');
                    tom.className = 'tom';
                    tom.textContent = musica.tom;
                    item.append(tom);
                }

                listaMusicas.append(item);
            });
        }

        async function carregarMusicas() {
            const response = await fetch('/music');

            if (!response.ok)
                return;

            const data = await response.json();
            musicas = data.sort((a, b) => b.id - a.id);
            mostrar();
        }

        busca.addEventListener('input', mostrar);
        carregarMusicas();
    </script>
</body>
</html>
